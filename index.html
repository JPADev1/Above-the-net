<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26242e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Above the Net">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Above the Net</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: phone app shell. Court-blue ink on a cool gym-floor ground, ball-yellow as the single accent; bottom tab bar, full-screen workout mode. */
:root{
  /* Hot Shots: charcoal jersey, mint lettering, pink numbers */
  --bg:#f3f1f6; --surface:#ffffff; --surface-2:#ebe7f0; --line:#dcd5e4;
  --ink:#24222c; --ink-2:#6a6475; --blue:#13806f; --blue-soft:#d8f2ec;
  --mint:#6fd3be; --on-mint:#1d1b24; --seam:#26242e;
  --ball:#f0a8d6; --ball-ink:#4a1238; --band:#e0457a;
  --good:#11805b; --good-soft:#d9f2e8; --warn:#a85300; --warn-soft:#fff0dc; --danger:#b42318;
  --wood:#c79a63; --wood-2:#9a7140; --hill:#9ec48a; --hill-2:#6d9a5a;
  --limb:#4b4656; --limb-far:#b3adbd; --shorts:#26242e; --pad:#ffffff; --pad-far:#e6e1ec; --shoe:#f0a8d6; --shoe-far:#e9cde0; --hair:#3a2a1e;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --splash:#26242e;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a21; --surface:#25232d; --surface-2:#2f2c39; --line:#3d3a49;
  --ink:#f4f0f7; --ink-2:#aca5b8; --blue:#7fdcc8; --blue-soft:#21393a;
  --mint:#7fdcc8; --on-mint:#1d1b24;
  --ball:#f3acd9; --ball-ink:#4a1238; --band:#ff6f9c;
  --good:#3fd09a; --good-soft:#123a35; --warn:#ffab55; --warn-soft:#3a2a14; --danger:#ff7a6e;
  --wood:#b68a55; --wood-2:#80603a; --hill:#4f7a45; --hill-2:#37582f; --splash:#1b1a21; --limb:#d6d0de; --limb-far:#6f6880; --shorts:#3a3746; --pad:#ffffff; --pad-far:#8a8399; --shoe:#f3acd9; --shoe-far:#8d6a82; --hair:#d9ab6a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a21; --surface:#25232d; --surface-2:#2f2c39; --line:#3d3a49;
  --ink:#f4f0f7; --ink-2:#aca5b8; --blue:#7fdcc8; --blue-soft:#21393a;
  --mint:#7fdcc8; --on-mint:#1d1b24;
  --ball:#f3acd9; --ball-ink:#4a1238; --band:#ff6f9c;
  --good:#3fd09a; --good-soft:#123a35; --warn:#ffab55; --warn-soft:#3a2a14; --danger:#ff7a6e;
  --wood:#b68a55; --wood-2:#80603a; --hill:#4f7a45; --hill-2:#37582f; --splash:#1b1a21; --limb:#d6d0de; --limb-far:#6f6880; --shorts:#3a3746; --pad:#ffffff; --pad-far:#8a8399; --shoe:#f3acd9; --shoe-far:#8d6a82; --hair:#d9ab6a; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.disp{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
h2{font-size:28px;font-weight:800}
h3{font-size:22px;font-weight:800}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase}
.brand span{display:block;color:var(--blue)}
.count{text-align:right}
.count b{font-family:var(--display);font-size:44px;font-weight:900;line-height:.9;display:block;color:var(--blue)}
.net{height:10px;border-radius:2px;background:
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 10px),
  repeating-linear-gradient(0deg,var(--ink) 0 1px,transparent 1px 5px);
  opacity:.35;border-top:4px solid var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--surface-2);min-height:48px}
.btn.primary{background:var(--mint);color:var(--on-mint)}
.btn.ball{background:var(--ball);color:var(--ball-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}

/* level */
.lvl{display:flex;gap:12px;align-items:center}
.lvl > svg{width:52px;height:52px;flex:none}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ball);border-radius:99px;transition:width .5s}

/* next session */
.next{background:var(--mint);color:var(--on-mint);border:0}
.next .muted{color:var(--on-mint);opacity:.75}
.next .eyebrow{color:var(--on-mint);opacity:.7}
.next h2{font-size:36px}
.next .btn.ball{font-size:18px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:rgba(255,255,255,.28);border-radius:10px;padding:8px 10px}
.stat3 b{font-family:var(--display);font-size:24px;display:block}
.stat3 span{font-size:12px;opacity:.85}

/* habits */
.bottles{display:flex;gap:8px;flex-wrap:wrap}
.bottle{width:40px;height:60px;border:0;background:none;padding:0}
.bottle svg{width:100%;height:100%}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:0;text-align:left;width:100%}
.toggle .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-2);flex:none;display:grid;place-items:center}
.toggle.on .box{background:var(--good);border-color:var(--good)}
.toggle.on .box::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.gear{display:flex;flex-direction:column;gap:8px}
.gearrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:0;text-align:left;width:100%;color:var(--ink);font:inherit}
.gearrow .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-2);flex:none;display:grid;place-items:center}
.gearrow[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.gearrow[aria-pressed="true"] .box::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.gearrow[aria-pressed="true"] b{text-decoration:line-through;opacity:.6}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}

/* plan */
.week{display:flex;flex-direction:column;gap:8px}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sess{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface-2);border:0;width:100%;text-align:left}
.sess .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--surface)}
.sess.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.sess.isnext{outline:2px solid var(--blue)}
.sess.isnext .dot{border-color:var(--blue);color:var(--blue)}
.sess .t{flex:1;min-width:0}
.sess .t b{display:block}

/* sheet / overlay */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.overlay .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
.xlist{display:flex;flex-direction:column;gap:8px}
.xrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.xrow .thumb{width:64px;height:58px;flex:none;background:var(--surface-2);border-radius:10px}
.xrow .t{flex:1;min-width:0}

/* workout */
.wtop{display:flex;align-items:center;gap:10px}
.wtop .bar{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-height:38vh}
.stage .tag{position:absolute;left:10px;top:10px}
.exname{font-size:38px;font-weight:900;text-transform:uppercase}
.rx{font-family:var(--display);font-size:24px;font-weight:800;color:var(--blue)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sets{display:flex;gap:10px;flex-wrap:wrap}
.setb{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;font-family:var(--display);font-size:22px}
.setb.done{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.setb.cur{border-color:var(--blue);color:var(--blue)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.stepper output{min-width:86px;text-align:center;font-family:var(--display);font-size:28px;font-weight:800}
.restbar{position:sticky;bottom:0;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.restbar b{font-family:var(--display);font-size:40px;line-height:1}
.restbar .btn{background:var(--bg);color:var(--ink);min-height:40px;padding:8px 14px}
.hype{font-style:italic}
.fbopts{display:grid;gap:10px}
.fb{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;width:100%}
.fb .e{font-size:30px}
.fb[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.fb b{display:block;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700}
.chipbtn[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.chipbtn.none[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--ink)}
.notice.blue{background:var(--blue-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;min-height:48px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;color:var(--blue)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.daypick button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;font-weight:700}
.bdg svg{width:54px;height:54px}
.bdg.locked{opacity:.35}
.cal{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center;font-size:13px}
.cal .c{height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12px}
.cal .c.done{background:var(--good);color:#fff}
.cal .c.next{outline:2px solid var(--blue);color:var(--blue)}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:300px;height:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom, 0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log td,table.log th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.log th{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
details summary{cursor:pointer;font-weight:700}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label.spickbtn,label.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
label.spickbtn:focus-within,label.filebtn:focus-within{outline:3px solid var(--ball);outline-offset:2px}
.wrow{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:2px solid transparent;border-radius:12px;padding:4px 6px 4px 4px;transition:border-color .2s,background .2s}
.wrow.cur{border-color:var(--blue);background:var(--blue-soft)}
.wrow.done .wsel b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.wchk{border:0;background:none;width:48px;height:48px;display:grid;place-items:center;flex:none;padding:0}
.wchk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-2);display:grid;place-items:center}
.wrow.done .wchk .box{background:var(--good);border-color:var(--good)}
.wrow.done .wchk .box::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.wsel{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;flex-direction:column;padding:8px 4px;min-height:48px}
.wrow .ytlink.short{margin-left:auto}
.installcard ol{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:4px}
.ytlink{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--blue);text-decoration:none;min-height:44px;padding:4px 0}
.ytlink.short{flex:none;font-size:13px;flex-direction:column;gap:2px;min-height:0;padding:4px}
.figure-far{stroke:var(--ink-2)}
/* intro splash */
#splash{position:fixed;inset:0;z-index:90;border:0;margin:0;width:100%;background:var(--splash);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding:env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sbrand{font-family:var(--display);font-weight:900;font-size:clamp(56px,16vw,88px);line-height:.85;text-transform:uppercase;letter-spacing:.01em}
#splash .sbrand span{display:block;color:var(--mint)}
#splash .scene{width:min(420px,100%);height:330px;position:relative;overflow:hidden;--tape:180px}
#splash .mesh{position:absolute;left:-10px;right:-10px;top:var(--tape);bottom:0;border-top:12px solid #fff;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.38) 0 3px,transparent 3px 30px),repeating-linear-gradient(0deg,rgba(255,255,255,.38) 0 3px,transparent 3px 30px);
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
#splash .sball{position:absolute;left:calc(50% - 38px);top:calc(var(--tape) - 38px);width:76px;height:76px;transform:translate(-30px,120px) rotate(-20deg);z-index:2}
#splash .sball svg{width:100%;height:100%;display:block}
#splash .burst{position:absolute;left:calc(50% - 60px);top:calc(var(--tape) - 175px);width:120px;height:120px;opacity:0;z-index:3;pointer-events:none}
#splash .trail{position:absolute;left:50%;top:calc(var(--tape) - 120px);width:340px;height:16px;border-radius:8px;transform-origin:0 50%;transform:rotate(62deg) scaleX(0);
  background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(255,255,255,0));opacity:0;z-index:1}
#splash.go .sball{animation:srise 2.7s linear forwards}
#splash.go .burst{animation:sburst 2.7s linear forwards}
#splash.go .trail{animation:strail 2.7s linear forwards}
@keyframes srise{
  0%{transform:translate(-30px,120px) rotate(-20deg);animation-timing-function:cubic-bezier(.2,.7,.35,1)}
  52%{transform:translate(0,-112px) rotate(120deg);animation-timing-function:ease-in-out}
  74%{transform:translate(4px,-100px) rotate(170deg);animation-timing-function:ease-out}
  76%{transform:translate(6px,-96px) rotate(175deg) scale(1.12,.86)}
  77%{transform:translate(14px,-80px) rotate(200deg) scale(.95,1.1);animation-timing-function:cubic-bezier(.5,0,1,1)}
  90%{transform:translate(190px,300px) rotate(620deg) scale(.9)}
  100%{transform:translate(190px,300px) rotate(620deg) scale(.9)}}
@keyframes sburst{0%,75%{opacity:0;transform:scale(.4)}77%{opacity:1;transform:scale(1)}86%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
@keyframes strail{0%,76%{opacity:0;transform:rotate(62deg) scaleX(0)}80%{opacity:.9;transform:rotate(62deg) scaleX(1)}92%{opacity:0;transform:rotate(62deg) scaleX(1)}100%{opacity:0}}
#splash .prompt{font-weight:700;font-size:18px;letter-spacing:.04em;opacity:.95;animation:pulse 1.4s ease-in-out infinite}
#splash.go .prompt{animation:none;opacity:.7}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#splash .sgo{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:22px;padding:0;cursor:pointer}
#splash .spick{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%}
#splash .spick span{opacity:.85;overflow-wrap:anywhere;text-align:center}
#splash .spickbtn{border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px}

function beep(freq, dur){ if (!S.settings.sound) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = freq || 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.18, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + (dur || .25)); o.start(); o.stop(actx.currentTime + (dur || .25)); } catch(e){} }
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
function addXp(n){ const before = level(S.xp).i; S.xp += n; const after = level(S.xp).i; if (after > before) setTimeout(() => { toast("Level up: " + LEVELS[after][1] + "!"); playSlot("level"); }, 700); }
function award(id){ if (S.badges[id]) return false; S.badges[id] = today(); return true; }
function rxText(it){ const ex = EX[it.id];
  if (ex.t === "test") return "Best of 3 jumps";
  if (it.id === "contrast") return it.sets + " rounds · 5 squats + " + it.reps + " jumps";
  if (ex.u === "sec") return Math.round(it.reps / 60) + " min";
  if (ex.t === "hold") return it.sets + " × " + it.reps + " sec" + (ex.side ? " each side" : "");
  if (ex.t === "hill") return it.reps + " climbs";
  if (ex.t === "warm") return it.reps + (ex.side ? " each side" : " reps");
  return it.sets + " × " + it.reps + (ex.side ? " each side" : ""); }
let __bid = 0;
function ballIcon(fill){
  // volleyball: three seam groups swirling out of the center, three curved lines each
  const id = "vb" + (++__bid), c = 27, R = 24;
  let defs = `<clipPath id="${id}"><circle cx="${c}" cy="${c}" r="${R}"/></clipPath>`, lines = "";
  [-90, 30, 150].forEach((a, i) => {
    const t = a * Math.PI / 180, x = c + R * Math.cos(t), y = c + R * Math.sin(t);
    const pts = []; for (let k = 0; k <= 12; k++){ const u = (a + k * 15) * Math.PI / 180; pts.push(f1(c + 40 * Math.cos(u)) + " " + f1(c + 40 * Math.sin(u))); }
    defs += `<clipPath id="${id}w${i}"><path d="M${c} ${c} L${pts.join(" L")} Z"/></clipPath>`;
    [R, R * 0.66, R * 0.33].forEach(r => { lines += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="none" clip-path="url(#${id}w${i})"/>`; });
  });
  return `<svg viewBox="0 0 54 54" aria-hidden="true"><defs>${defs}</defs><circle cx="${c}" cy="${c}" r="${R}" fill="${fill}"/><g clip-path="url(#${id})" stroke="var(--seam, #26242e)" stroke-width="2.2">${lines}</g><circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--seam, #26242e)" stroke-width="2.5"/></svg>`;
}

function estMin(r){ let s = 360; r.items.forEach(it => { const ex = EX[it.id]; const per = ex.t === "hold" ? it.reps : ex.t === "hill" ? 25 : ex.t === "test" ? 240 : 35; const n = ex.t === "hill" ? it.reps : it.sets * (ex.side ? 2 : 1); s += n * per + (it.sets - 1) * it.rest * (ex.t === "hill" ? 0 : 1) + (ex.t === "hill" ? it.reps * 40 : 0); }); return Math.round(s / 300) * 5; }

/* ---------------- PROGRESS ---------------- */
function vertChart(){
  const T = S.tests; if (!T.length) return `<p class="muted small">Your jump test chart appears after the Baseline Day test.</p>`;
  const W0 = 340, H = 180, pl = 34, pr = 14, pt = 14, pb = 28;
  const base = T[0].vert;
  const vals = T.map(t => t.vert).concat([base + 3]);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const x0 = fromIso(planStart()).getTime(), x1 = Math.max(fromIso(target()).getTime(), fromIso(T[T.length-1].date).getTime(), x0 + 864e5);
  const X = d => pl + (fromIso(d).getTime() - x0) / (x1 - x0) * (W0 - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let g = ""; for (let v = lo; v <= hi; v++){ if ((hi - lo) > 8 && v % 2) continue; g += `<line x1="${pl}" x2="${W0-pr}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${f1(Y(v)+4)}" text-anchor="end" font-size="11" fill="var(--ink-2)">${v}"</text>`; }
  const band = `<rect x="${pl}" y="${f1(Y(base+3))}" width="${W0-pl-pr}" height="${f1(Y(base+1) - Y(base+3))}" fill="var(--ball)" opacity=".22"/><text x="${W0-pr-4}" y="${f1(Y(base+3)+13)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink-2)">target +1–3"</text>`;
  const pts = T.map(t => [X(t.date), Y(t.vert)]);
  const path = pts.map((p,i) => (i ? "L" : "M") + f1(p[0]) + " " + f1(p[1])).join(" ");
  const area = pts.length > 1 ? `<path d="${path} L${f1(pts[pts.length-1][0])} ${H-pb} L${f1(pts[0][0])} ${H-pb} Z" fill="var(--blue)" opacity=".12"/>` : "";
  const dots = pts.map((p,i) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${i === pts.length-1 ? 6 : 4}" fill="${i === pts.length-1 ? "var(--ball)" : "var(--blue)"}" stroke="var(--blue)" stroke-width="2"/>`).join("");
  const ticks = [0, 1/3, 2/3, 1].map(f => { const d = iso(new Date(x0 + (x1 - x0) * f)); return [d, fmtShort(d)]; }).map(([d,l]) => `<text x="${f1(X(d))}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${l}</text>`).join("");
  return `<div class="chartbox"><svg viewBox="0 0 ${W0} ${H}" role="img" aria-label="Vertical jump over time">${g}${band}${area}<path d="${path}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round"/>${dots}${ticks}</svg></div>`;
}
function netGauge(){
  const t = S.tests[S.tests.length - 1]; if (!t) return "";
  const touch = t.reach + t.vert, appr = t.appr || null;
  const top = Math.max(NET + 14, touch + 4, (appr || 0) + 4), bot = t.reach - 6;
  const H = 200, Y = v => 10 + (top - v) / (top - bot) * (H - 20);
  const ftin = v => Math.floor(v / 12) + "'" + (Math.round((v % 12) * 10) / 10) + "\"";
  const mark = (v, label, col) => `<line x1="90" x2="300" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="${col}" stroke-width="3" stroke-linecap="round"/><text x="86" y="${f1(Y(v)+4)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${label}</text><text x="304" y="${f1(Y(v)+4)}" font-size="12" fill="var(--ink-2)">${ftin(v)}</text>`;
  const netTop = Y(NET);
  const net = `<rect x="150" y="${f1(netTop)}" width="90" height="${f1(Math.min(H - netTop, 40))}" fill="none" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/><rect x="150" y="${f1(netTop-3)}" width="90" height="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><text x="195" y="${f1(netTop-8)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">NET 7'4⅛"</text>`;
  const over = touch - NET, aover = appr ? appr - NET : null;
  return `<section class="card"><h3>Reach vs the net</h3>
  <div class="chartbox"><svg viewBox="0 0 350 ${H}" role="img" aria-label="Touch height compared to net">${net}${mark(t.reach,"Standing","var(--ink-2)")}${mark(touch,"Jump touch","var(--blue)")}${appr ? mark(appr,"Approach","var(--ball)") : ""}</svg></div>
  <p class="small">${over >= 0 ? `Standing jump reaches <b>${f1(over)}"</b> above the net.` : `Standing jump is <b>${f1(-over)}"</b> below the net tape.`}${aover != null ? ` Approach touch is <b>${f1(aover)}"</b> ${aover >= 0 ? "above" : "below"} it.` : " Add an approach touch in your next test to see your real hitting reach."} Hitters usually want their hand 6"+ over the tape to swing down on the ball.</p></section>`;
}
function viewProgress(){

  return `<div><span class="eyebrow">How it's going</span><h2 style="font-size:40px">Progress</h2></div>
  <section class="card"><div class="row between" style="align-items:flex-end"><div><span class="eyebrow">Vertical jump</span><div class="big num">${best ? f1(best) + '<span style="font-size:32px">"</span>' : "—"}</div></div>
  <div style="text-align:right">${base != null && S.tests.length > 1 ? `<span class="chip ${best - base > 0 ? "good" : ""}">${best - base >= 0 ? "+" : ""}${f1(best - base)}" since baseline</span>` : `<span class="small muted">${S.tests.length ? "Baseline set" : "No test yet"}</span>`}</div></div>
  ${vertChart()}
  <button class="btn ghost" data-act="test">Log a jump test</button></section>
  ${netGauge()}
  <section class="card"><div class="row between"><h3>Workouts</h3><span class="chip num">${doneN}/16</span></div>${cal}<p class="small muted num">${totalJ} total jumps logged</p></section>
  ${lifts ? `<section class="card"><h3>Dumbbells</h3><table class="log"><thead><tr><th>Lift</th><th>Last</th><th>Best</th></tr></thead><tbody>${lifts}</tbody></table></section>` : ""}
  <section class="card"><h3>Badges</h3><div class="badges">${BADGES.map(b => `<div class="bdg ${S.badges[b.id] ? "" : "locked"}" title="${esc(b.d)}">${ballIcon(S.badges[b.id] ? "var(--ball)" : "var(--surface-2)")}<span>${esc(b.n)}</span></div>`).join("")}</div><p class="small muted">Faded ones are still locked. Tap and hold for how to earn them.</p></section>
  ${hist ? `<section class="card"><h3>Workout log</h3><div class="chartbox"><table class="log"><tbody>${hist}</tbody></table></div></section>` : ""}`;
}

function finishWorkout(){
  WK.end = Date.now();

  const newB = [];
  if (WK.sid !== "rec"){
    const prevRating = WK.rating;
    S.done[WK.sid] = {date: today(), rating: prevRating, sore: WK.sore.slice(), contacts, xp: WK.xp, min: Math.round((WK.end - WK.start) / 60000)};
    const b0 = effBoost(sess.wk);
    let nb = b0 + (prevRating === "more" ? 1 : prevRating === "hard" ? -1 : 0);
    if (WK.sore.length && nb > 0) nb = 0;
    S.boost = Math.max(-2, Math.min(2, nb)); S.lastWeek = sess.wk; S.sore = WK.sore.length > 0;
    WK.items.forEach((it,k) => { const ex = EX[it.id]; if (ex.db && WK.sets[k] > 0){ const lb = WK.weights[k] || it.weight || ex.w0; const prev = S.wlog[it.id]; S.wlog[it.id] = {lb, wk: sess.wk, rating: prevRating, best: Math.max(lb, prev && prev.best || 0)}; } });

    if (award("first")) newB.push("first");
    [1,2,3,4].forEach(w => { if (PLAN.filter(p => p.wk === w).every(p => S.done[p.id]) && award(w === 4 ? "wk4" : "wk" + w)) newB.push(w === 4 ? "wk4" : "wk" + w); });

/* ---------------- confetti ---------------- */
function confetti(){

  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"); const dpr = window.devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement); const cols = ["--ball","--blue","--good","--band"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length: 120}, () => ({x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6}));
  const t0 = performance.now();
  const step = now => { ctx.clearRect(0, 0, innerWidth, innerHeight); P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore(); }); if (now - t0 < 2600) requestAnimationFrame(step); else c.remove(); };
  requestAnimationFrame(step);
}

const SLOTS = [["intro","Intro (app opens)"],["set","Set logged"],["rest","Rest is over"],["done","Workout complete"],["level","Level up"]];
function rig(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const ctx = actx; if (ctx.state === "suspended") ctx.resume();
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  // two detuned saws per voice with analog drift, 4-pole lowpass with a brassy envelope, saturation, stereo chorus, short echo
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3.5;
  const master = ctx.createGain(); master.gain.value = 0.55;
  comp.connect(master); master.connect(ctx.destination);
  const sat = ctx.createWaveShaper(); const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++){ const x = i / 511.5 - 1; curve[i] = Math.tanh(1.8 * x) / Math.tanh(1.8); }
  sat.curve = curve; sat.oversample = "2x"; sat.connect(comp);
  const bus = ctx.createGain(); bus.gain.value = 0.9; bus.connect(sat);
  const pan = v => { if (!ctx.createStereoPanner) return null; const p = ctx.createStereoPanner(); p.pan.value = v; return p; };

    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.45 + j * 0.27; lg.gain.value = 0.0028;
    lfo.connect(lg); lg.connect(d.delayTime); lfo.start(); lfo.stop(ctx.currentTime + 6);
    const wg = ctx.createGain(); wg.gain.value = 0.5; bus.connect(d); d.connect(wg);
    const p = pan(pv); if (p){ wg.connect(p); p.connect(sat); } else wg.connect(sat);
  });

    f1.connect(f2); f2.connect(env); env.connect(bus);

    [[-spread, -0.3], [spread, 0.3]].forEach(([d, pv]) => {
      const osc = ctx.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = hz(midi);
      osc.detune.value = d + (Math.random() * 6 - 3);

}
function playIntroSynth(){
  try {
    const R = rig(), {synth, chord, kick, noise} = R, t0 = R.t0;
    const s16 = 60 / 132 / 4;
    // 1) C major: rising arpeggio over a swelling C triad pad
    [48, 55, 60, 64, 67, 72, 76, 79].forEach((m, i) => synth(m, t0 + i * s16, s16 * 1.6, {vol: 0.055, cut0: 500, cut1: 5200, sus: 0.35, sweep: 0.012, rel: 0.14}));
    chord([48, 52, 55, 60], t0, s16 * 8, {vol: 0.035, atk: 0.45, cut0: 220, cut1: 1700, sweep: 0.8, sus: 0.8, q: 1});
    [0, 4].forEach(b => kick(t0 + b * s16));
    // 2) F → G triad stabs (IV → V), each with its root in the bass
    const t1 = t0 + 8 * s16;
    chord([41, 53, 57, 60, 65], t1, s16 * 1.6, {vol: 0.065});
    chord([41, 53, 57, 60, 65], t1 + 3 * s16, s16 * 1.6, {vol: 0.065});
    chord([43, 55, 59, 62, 67], t1 + 6 * s16, s16 * 1.2, {vol: 0.065});
    chord([43, 55, 59, 62, 67], t1 + 7 * s16, s16 * 2.4, {vol: 0.07, cut1: 5200});
    kick(t1); noise(t1 + 3 * s16, 0.12, 1800, 0.35); kick(t1 + 6 * s16);
    for (let i = 0; i < 4; i++) noise(t1 + (8 + i * 0.5) * s16, 0.06, 2200, 0.15 + i * 0.07);
    // 3) back home: the big C major landing with a crash
    const t2 = t1 + 10 * s16;
    chord([36, 48, 55, 60, 64, 67, 72], t2, 1.15, {vol: 0.07, cut0: 400, cut1: 5000, sus: 0.6, rel: 0.7, sweep: 0.06});
    synth(84, t2, 0.9, {vol: 0.03, cut0: 1200, cut1: 6000, sus: 0.7, rel: 0.6});
    kick(t2); noise(t2, 1.4, 5000, 0.4);
  } catch(e){}
}
function sfxSynth(slot){
  try {
    const R = rig(), t = R.t0;
    if (slot === "set"){ R.chord([60,64,67], t, 0.08, {vol:0.06, cut0:600, cut1:4800, sus:0.4, rel:0.08}); R.chord([72,76,79], t + 0.09, 0.12, {vol:0.05, cut0:700, cut1:5500, sus:0.4, rel:0.14}); }
    else if (slot === "rest"){ R.chord([55,59,62], t, 0.12, {vol:0.06, rel:0.1, cut1:4500}); R.chord([60,64,67,72], t + 0.16, 0.35, {vol:0.065, rel:0.3, cut1:5200}); R.kick(t + 0.16); }
    else if (slot === "done"){ [60,64,67,72].forEach((m,i) => R.synth(m + 12, t + i * 0.09, 0.14, {vol:0.05, cut0:600, cut1:5200, sus:0.35, rel:0.1})); R.chord([48,60,64,67,72], t + 0.38, 0.9, {vol:0.065, cut0:400, cut1:5000, sus:0.6, rel:0.6}); R.kick(t + 0.38); R.noise(t + 0.38, 1.0, 5000, 0.3); }

const AIDB = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { try { const r = indexedDB.open("above-the-net-audio", 1); r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); },
  async put(k, v){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction("files").objectStore("files").get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); },
  async del(k){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
};

  s.id = "splash"; s.setAttribute("role", "dialog"); s.setAttribute("aria-label", "Welcome");
  const label = () => customName("intro") ? "Intro song: " + customName("intro") : "Intro: synth fanfare";
  s.innerHTML = `<button type="button" class="sgo"><div class="sbrand">Above<span>the Net</span></div><div class="scene" aria-hidden="true"><div class="mesh"></div><div class="trail"></div><svg class="burst" viewBox="0 0 120 120" aria-hidden="true"><line x1="82.0" y1="60.0" x2="114.0" y2="60.0" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/><line x1="75.6" y1="75.6" x2="98.2" y2="98.2" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/><line x1="60.0" y1="82.0" x2="60.0" y2="114.0" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/><line x1="44.4" y1="75.6" x2="21.8" y2="98.2" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/><line x1="38.0" y1="60.0" x2="6.0" y2="60.0" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/><line x1="44.4" y1="44.4" x2="21.8" y2="21.8" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/><line x1="60.0" y1="38.0" x2="60.0" y2="6.0" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/><line x1="75.6" y1="44.4" x2="98.2" y2="21.8" stroke="#f0a8d6" stroke-width="6" stroke-linecap="round"/></svg><div class="sball">${ballIcon("var(--ball)")}</div></div><div class="prompt">Tap to jump in</div></button>
  <div class="spick"><span class="small" id="songname"></span><div class="row" style="justify-content:center"><span data-s="pickwrap"></span><button type="button" class="spickbtn" data-s="synth" hidden>Use synth</button></div></div>`;
  document.body.appendChild(s);
  const sync = () => { s.querySelector("#songname").textContent = label(); s.querySelector('[data-s="pickwrap"]').innerHTML = fileLabel("intro", customName("intro") ? "Change song" : "Pick a song", "spickbtn"); s.querySelector('[data-s="synth"]').hidden = !customName("intro"); };
  sync();
  let st = 0;
  const close = () => { if (st === 2) return; st = 2; s.classList.add("out"); setTimeout(() => s.remove(), 520); };
  s.querySelector(".sgo").addEventListener("click", () => {
    if (st === 0){ st = 1; s.classList.add("go"); s.querySelector(".prompt").textContent = "Tap to skip"; s.querySelector(".spick").hidden = true; playSlot("intro", true); setTimeout(close, 3500); }
    else close();
  });
  s.addEventListener("change", e => { if (e.target.matches('input[data-slot="intro"]')) saveAudioFile("intro", e.target.files && e.target.files[0], () => { sync(); s.querySelector(".prompt").textContent = "Song ready. Tap to jump in"; }); });
  s.addEventListener("pointerdown", e => { if (e.target.closest(".spickbtn")) { try { rig(); } catch(err){} } });
  s.querySelector('[data-s="synth"]').addEventListener("click", async () => { await clearAudio("intro"); sync(); });
}

/* ---------------- player profile + fuel ---------------- */
const FOODS = [["Chocolate milk, 1 cup",8],["Greek yogurt, single cup",15],["2 eggs",12],["Turkey sandwich",20],["String cheese",7],["Chicken, 3 oz",25],["Peanut butter, 2 tbsp",7],["Smoothie with milk + Greek yogurt",20]];
function fuel(){
  const p = S.profile; if (!p || !p.wLb) return null;
  const kg = p.wLb / 2.2046, r5 = x => Math.round(x / 5) * 5;
  return {day: r5(1.5 * kg), lo: r5(1.3 * kg), hi: r5(1.7 * kg), meal: Math.round(0.3 * kg), post: Math.round(0.3 * kg)};
}
function fuelCard(){
  const f = fuel();
  if (!f) return `<section class="card"><h3>Fuel targets</h3><p class="small muted">Add your player profile to see how much protein helps you recover.</p><button class="btn ghost" data-act="profile">Set up profile</button></section>`;
  return `<section class="card"><div class="row between"><h3>Fuel targets</h3><span class="chip blue">Protein</span></div>
  <div class="grid2"><div><span class="eyebrow">Each day</span><div class="disp num" style="font-size:40px;color:var(--blue)">~${f.day} g</div></div><div><span class="eyebrow">After training</span><div class="disp num" style="font-size:40px;color:var(--blue)">~${f.post} g</div></div></div>
  <p class="small">Spread it out: about ${f.meal} g at each meal or snack, 4 or 5 times a day. Carbs and water after practice matter just as much for refilling your legs.</p>
  <details><summary class="small">What protein looks like</summary><table class="log" style="margin-top:6px"><tbody>${FOODS.map(([n,g]) => `<tr><td>${esc(n)}</td><td class="num" style="text-align:right">~${g} g</td></tr>`).join("")}</tbody></table></details>
  <p class="small muted">A general guide for teen athletes, not a diet. Eating enough overall is what powers big jumps and growing. Questions? Ask your doctor or a sports dietitian.</p></section>`;
}
function profileForm(p){
  p = p || {}; const h = p.hIn || 64, ft = Math.floor(h / 12), inch = Math.round(h % 12);
  return `<div class="field"><label for="pf_name">First name</label><input id="pf_name" value="${esc(S.name || "")}" autocomplete="off"></div>
  <div class="grid2"><div class="field"><label for="pf_age">Age</label><input id="pf_age" type="number" inputmode="numeric" min="8" max="88" value="${p.age || ""}"></div><div class="field"><label for="pf_w">Weight (lb)</label><input id="pf_w" type="number" inputmode="decimal" min="50" max="300" value="${p.wLb || ""}"></div></div>
  <div class="field"><label for="pf_ft">Height</label><div class="grid2"><select id="pf_ft" aria-label="Feet">${[4,5,6,7].map(v => `<option value="${v}" ${v === ft ? "selected" : ""}>${v} ft</option>`).join("")}</select><select id="pf_in" aria-label="Inches">${Array.from({length:12}, (_,i) => `<option value="${i}" ${i === inch ? "selected" : ""}>${i} in</option>`).join("")}</select></div></div>
  <div class="field"><label for="pf_reach">Standing reach (inches)</label><input id="pf_reach" inputmode="decimal" value="${p.reach || ""}" placeholder="e.g. 85 or 7'1"><span class="small muted">Stand flat-footed next to a wall, reach one arm straight up, and measure from the floor to your fingertips.</span><button type="button" class="btn ghost small" data-act="estreach">Estimate it from my height</button></div>
  <div class="field"><label for="pf_target">First club practice</label><input id="pf_target" type="date" value="${target()}"><span class="small muted">The countdown, plan dates and reminders all build toward this day.</span></div>
  <p id="pf_err" class="small" style="color:var(--danger)"></p>`;
}
function readProfile(){
  const v = id => ($("#" + id) || {}).value;
  const name = (v("pf_name") || "").trim().slice(0, 20), age = parseInt(v("pf_age"), 10), wLb = parseFloat(v("pf_w"));
  const hIn = parseInt(v("pf_ft"), 10) * 12 + parseInt(v("pf_in"), 10), reach = parseIn(v("pf_reach"));
  if (!(age >= 8 && age <= 88)) return {err: "Enter an age between 8 and 88."};
  if (!(wLb >= 50 && wLb <= 300)) return {err: "Enter weight in pounds (50 to 300)."};
  if (!(hIn >= 48 && hIn <= 90)) return {err: "Check the height."};
  if (!(reach >= 55 && reach <= 115)) return {err: "Enter standing reach in inches, like 85 or 7'1."};
  const tgt = v("pf_target");
  if (!isoOk(tgt)) return {err: "Pick the date of the first club practice."};
  return {name, target: tgt, p: {age, wLb: Math.round(wLb * 10) / 10, hIn, reach: Math.round(reach * 10) / 10, setAt: (S.profile && S.profile.setAt) || today()}};
}
function openProfile(first){
  $("#ov").innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Player profile"><div class="inner">
  ${first ? "" : `<div class="row"><button class="iconbtn" data-act="close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`}
  <div><span class="eyebrow">${first ? "Welcome" : "Settings"}</span><h2 style="font-size:40px">${first ? "Build your player profile" : "Player profile"}</h2><p class="muted" style="margin-top:8px">This sets your recovery fuel targets and the starting point for your jump tests. It stays on this phone.</p></div>
  <section class="card">${profileForm(S.profile)}</section>
  <button class="btn primary block" data-act="saveprofile">Save profile</button></div></div>`;
}
function profileSummary(){
  const p = S.profile;
  if (!p) return `<section class="card"><h3>Player profile</h3><p class="small muted">Not set up yet.</p><button class="btn ghost" data-act="profile">Set up profile</button></section>`;
  return `<section class="card"><div class="row between"><h3>Player profile</h3><button class="btn ghost small" data-act="profile">Edit</button></div>
  <table class="log"><tbody><tr><td>Age</td><td class="num">${p.age}</td></tr><tr><td>Height</td><td class="num">${Math.floor(p.hIn/12)}'${p.hIn % 12}"</td></tr><tr><td>Weight</td><td class="num">${p.wLb} lb</td></tr><tr><td>Standing reach</td><td class="num">${p.reach}" (${Math.floor(p.reach/12)}'${f1(p.reach % 12)}")</td></tr></tbody></table></section>`;
}
function soundsCard(){
  const s = S.settings;
  return `<section class="card"><h3>Sounds</h3>
  <button class="toggle ${s.intro ? "on" : ""}" data-act="set" data-k="intro"><span class="box"></span><span>Show the intro when the app opens</span></button>
  <button class="toggle ${s.sound ? "on" : ""}" data-act="set" data-k="sound"><span class="box"></span><span>Sound effects during workouts</span></button>
  <div class="xlist">${SLOTS.map(([k,l]) => { const c = customName(k); return `<div class="snd"><div class="t"><b>${l}</b><span class="small muted">${c ? esc(c) : "Synth sound"}</span></div><div class="row"><button class="btn ghost small" data-act="testsnd" data-k="${k}">Play</button>${fileLabel(k, c ? "Change file" : "Use my file", "btn ghost small filebtn")}${c ? `<button class="btn ghost small" data-act="clrsnd" data-k="${k}">Back to synth</button>` : ""}</div></div>`; }).join("")}</div>
  <p class="small muted">Sound files stay in this phone's browser and aren't uploaded anywhere. Effects play for up to 4 seconds. The intro song plays until it ends or you tap Stop.</p></section>`;
}


/* ---------------- install help (Android + iPhone) ---------------- */
let installPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; if (TAB === "me") render(); });
window.addEventListener("appinstalled", () => { installPrompt = null; toast("Installed. Open it from your home screen."); });
const isInstalled = () => (window.matchMedia && (matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches)) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function installCard(){
  if (isInstalled() || (window.claude && window.claude.use)) return "";
  if (isIOS()) return `<section class="card installcard"><h3>Install on iPhone</h3><ol class="small"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open it from the volleyball icon. It runs full screen.</li></ol><p class="small muted">The installed app keeps its own progress, separate from Safari. If you already logged workouts here, copy a backup code below first and restore it in the app.</p></section>`;
  return `<section class="card installcard"><h3>Install the app</h3>${installPrompt ? `<button class="btn primary" data-act="install">Install Above the Net</button>` : `<ol class="small"><li>Open this page in <b>Chrome</b>.</li><li>Tap <b>⋮</b> → <b>Install app</b> (or <b>Add to home screen → Install</b>).</li><li>Open it from the volleyball icon. It runs full screen.</li></ol>`}</section>`;
}
/* ---------------- start up ---------------- */
/* resume an unfinished workout */
try { const w = JSON.parse(localStorage.getItem(LSW) || "null"); if (w && w.sid && w.sid !== "test" && Date.now() - w.start < 4 * 3600e3 && w.idx <= w.items.length) pendingWip = w; else localStorage.removeItem(LSW); } catch(e){}
render();
if (!S.profile) openProfile(true);
showSplash();
(async () => { for (const [k] of SLOTS) if (customName(k)) await loadSlot(k).catch(() => {}); })();
</script>
